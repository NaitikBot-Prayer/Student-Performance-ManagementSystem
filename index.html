<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradebook — Student Performance Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="wordmark">Grade<span>book</span></div>
    <div class="tagline">Student performance &amp; assessment tracking</div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="active" data-tab="students">Students</button>
    <button data-tab="marks">Record Marks</button>
    <button data-tab="report">Report Card</button>
    <button data-tab="rank">Class Ranking</button>
  </nav>

  <section id="tab-students">
    <div class="card">
      <h2>Add a student</h2>
      <form id="studentForm">
        <div class="grid">
          <div><label for="sId">Student ID</label><input id="sId" placeholder="S101" required></div>
          <div><label for="sName">Full name</label><input id="sName" placeholder="Aditi Sharma" required></div>
          <div><label for="sClass">Class / section</label><input id="sClass" placeholder="10-A" required></div>
        </div>
        <button class="btn" type="submit">Add student</button>
        <div class="msg" id="studentMsg"></div>
      </form>
    </div>
    <div class="card">
      <h2>Roster</h2>
      <div class="table-wrap"><table id="studentTable">
        <thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Assessments</th><th></th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="empty" id="studentEmpty" hidden>No students yet — add one above to get started.</div>
    </div>
  </section>

  <section id="tab-marks" hidden>
    <div class="card">
      <h2>Record an assessment</h2>
      <form id="markForm">
        <div class="grid">
          <div><label for="mStudent">Student</label><select id="mStudent" required></select></div>
          <div><label for="mSubject">Subject</label><input id="mSubject" placeholder="Mathematics" required></div>
          <div><label for="mType">Exam type</label>
            <select id="mType">
              <option value="Unit Test">Unit Test</option>
              <option value="Mid-Term">Mid-Term</option>
              <option value="Final Exam">Final Exam</option>
            </select>
          </div>
          <div></div>
          <div><label for="mMarks">Marks obtained</label><input id="mMarks" type="number" step="0.5" min="0" required></div>
          <div><label for="mMax">Maximum marks</label><input id="mMax" type="number" step="0.5" min="1" value="100" required></div>
        </div>
        <button class="btn" type="submit">Add assessment</button>
        <div class="msg" id="markMsg"></div>
      </form>
    </div>
  </section>

  <section id="tab-report" hidden>
    <div class="card">
      <h2>Report card</h2>
      <label for="reportStudent">Choose a student</label>
      <select id="reportStudent"></select>
      <div id="reportBody"></div>
    </div>
  </section>

  <section id="tab-rank" hidden>
    <div class="card">
      <h2>Class ranking</h2>
      <div class="table-wrap"><table id="rankTable">
        <thead><tr><th>Rank</th><th>ID</th><th>Name</th><th>Class</th><th class="num">%</th><th>Grade</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="empty" id="rankEmpty" hidden>No students to rank yet.</div>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
